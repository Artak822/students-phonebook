name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aspirs_test
          POSTGRES_PASSWORD: aspirs_test
          POSTGRES_DB: aspirs_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://aspirs_test:aspirs_test@localhost:5433/aspirs_test
        run: alembic upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://aspirs_test:aspirs_test@localhost:5433/aspirs_test
          TEST_DATABASE_URL: postgresql+asyncpg://aspirs_test:aspirs_test@localhost:5433/aspirs_test
          REDIS_URL: redis://localhost:6380/0
          SECRET_KEY: test-secret-key-32-chars-minimum!!
          COOKIE_DOMAIN: localhost
          CORS_ORIGINS: ""
        run: pytest -v -n auto --tb=short
